
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MHEALTH Dataset | Research Report</title>
  <meta name="description" content="MHEALTH dataset analysis and research report.">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 30px 7%;
    }

    header h1 { margin: 0 0 10px; }

    header p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.6;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .button {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: 600;
      background: #2563eb;
      color: white;
    }

    .button.secondary {
      background: white;
      color: #172033;
      border: 1px solid #d1d5db;
    }

    .viewer {
      background: white;
      border: 1px solid #dce1e8;
      border-radius: 10px;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 78vh;
      min-height: 550px;
      border: 0;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header { padding: 25px 20px; }
      iframe { height: 70vh; min-height: 450px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>MHEALTH Dataset</h1>
    <p>Research Report · Human Activity Recognition · Machine Learning</p>
  </header>

  <main>
    <div class="toolbar">
      <div>
        <h2>Research Report</h2>
        <p>Read the report below or download the PDF.</p>
      </div>

      <div>
        <a class="button"
           href="./report/MHEALTH_Report_v2_preview.pdf"
           target="_blank" rel="noopener">
          Open PDF ↗
        </a>

        <a class="button secondary"
           href="./report/MHEALTH_Report_v2_preview.pdf"
           download>
          Download
        </a>
      </div>
    </div>

    <section class="viewer">
      <iframe
        src="./report/MHEALTH_Report_v2_preview.pdf"
        title="MHEALTH Research Report">
        <p>
          Your browser cannot display the PDF.
          <a href="./report/MHEALTH_Report_v2_preview.pdf">
            Open the report here.
          </a>
        </p>
      </iframe>
    </section>
  </main>

  <footer>
    MHEALTH Dataset Research Project
  </footer>
</body>
</html>
